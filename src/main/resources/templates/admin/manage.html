<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administration</title>
    <link href="/css/custom.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="fas fa-shield-alt me-2"></i>Spring Security JPA
        </a>
        <div class="navbar-nav">
            <a class="nav-link" href="/dashboard">
                <i class="fas fa-arrow-left me-1"></i>Retour
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h4><i class="fas fa-cogs me-2"></i>Espace Administration</h4>
                </div>
                <div class="card-body">
                    <p class="lead" th:text="${message}"></p>
                    <p>Cette page est <strong>exclusivement réservée</strong> aux utilisateurs avec le rôle <strong>ROLE_ADMIN</strong>.</p>

                    <div class="mt-4">
                        <h5><i class="fas fa-tasks me-2"></i>Fonctionnalités administrateur:</h5>
                        <ul>
                            <li>Gestion des utilisateurs</li>
                            <li>Gestion des rôles</li>
                            <li>Visualisation des logs</li>
                            <li>Configuration du système</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
