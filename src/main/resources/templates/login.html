<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Spring Security JPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body class="login-bg">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card login-card">
                <div class="card-header text-white text-center py-4 login-header">
                    <h3><i class="fas fa-shield-alt me-2"></i>Spring Security JPA</h3>
                    <p class="mb-0 opacity-75">Authentification sécurisée</p>
                </div>
                <div class="card-body p-5">
                    <!-- Messages d'alerte -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${logoutMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${logoutMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Formulaire de connexion -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="fas fa-user me-2 text-primary"></i>Nom d'utilisateur
                            </label>
                            <input type="text" class="form-control form-control-lg border-2"
                                   id="username" name="username"
                                   placeholder="Entrez votre nom d'utilisateur" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                <i class="fas fa-key me-2 text-primary"></i>Mot de passe
                            </label>
                            <input type="password" class="form-control form-control-lg border-2"
                                   id="password" name="password"
                                   placeholder="Entrez votre mot de passe" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-4 py-2 fw-semibold">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>

                    <!-- Comptes de test -->
                    <div class="card bg-light border-0">
                        <div class="card-body p-3">
                            <h6 class="card-title fw-semibold mb-3">
                                <i class="fas fa-info-circle me-2 text-info"></i>Comptes de test
                            </h6>
                            <div class="row">
                                <div class="col-12 mb-2">
                                    <div class="d-flex align-items-center">
                                        <span class="badge bg-primary me-2">Admin</span>
                                        <small class="text-muted">admin / 1234</small>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="d-flex align-items-center">
                                        <span class="badge bg-success me-2">User</span>
                                        <small class="text-muted">user / 1111</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
